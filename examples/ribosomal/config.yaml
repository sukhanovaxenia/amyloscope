# amyloscope example configuration
# ----------------------------------
# This file reproduces the original hardcoded ribosomal-protein analysis as an
# explicit, validated configuration. Everything the legacy scripts baked into
# Python source -- the RPS2->eS2 display map, per-protein lengths, the eight
# predictors and their APR-calling rules, the consensus tiers, the domain
# palette, and the ribosome-protection interpretation -- now lives here.
#
# The same package, pointed at a different config, analyses any protein panel.
#
# Inputs are SYNTHETIC fixtures generated by make_fixtures.py; regenerate them
# with `python examples/ribosomal/make_fixtures.py`, then run from the repo root:
#   amyloscope run examples/ribosomal/config.yaml

name: ribosomal_amyloidogenicity
output_dir: examples/ribosomal/output

# Optional analysis hypothesis. Previously this ribosome-protection narrative
# was hardcoded into the statistical-report generator; surfacing it here keeps
# the report engine protein-agnostic while preserving the interpretation.
hypothesis: >
  Aggregation-prone regions in ribosomal proteins are expected to coincide with
  rRNA-contacting surfaces. In the assembled ribosome these surfaces are buried
  against RNA and therefore sterically protected from intermolecular cross-beta
  pairing; the same segments are predicted to be exposed, and thus aggregation-
  competent, only in the free (pre-assembly or post-degradation) protein. APR
  enrichment within RNA-binding domains is consistent with this masking model.

# --------------------------------------------------------------------------- #
# Protein panel. `id` resolves file paths; `display_name` is the figure label
# (the single configured replacement for the triplicated naming map). Domains
# carry an abstract `category` that the palette colours, decoupling rendering
# from ribosome-specific fold names.
# --------------------------------------------------------------------------- #
proteins:
  - id: RPS2
    display_name: eS2
    length: 120
    domains:
      - {name: N-terminal extension, start: 1,   stop: 17,  category: disordered}
      - {name: rRNA-binding core,    start: 18,  stop: 86,  category: rna_binding}
      - {name: globular C-lobe,      start: 87,  stop: 120, category: structured_core}

  - id: RPL36
    display_name: eL36
    length: 105
    domains:
      - {name: zinc-ribbon core,     start: 6,   stop: 70,  category: structured_core}
      - {name: rRNA contact loop,    start: 71,  stop: 105, category: rna_binding}

  - id: RPS28
    display_name: eS28
    length: 69
    domains:
      - {name: OB-fold barrel,       start: 5,   stop: 55,  category: structured_core}
      - {name: rRNA-binding loop,    start: 56,  stop: 69,  category: rna_binding}

  - id: RPL27
    display_name: eL27
    length: 110
    domains:
      - {name: N-terminal tail,      start: 1,   stop: 14,  category: terminal}
      - {name: rRNA-binding core,    start: 15,  stop: 90,  category: rna_binding}
      - {name: C-terminal helix,     start: 91,  stop: 110, category: structured_core}

# --------------------------------------------------------------------------- #
# Predictor panel. Each tool declares which adapter parses its native output
# and the detection strategy that converts that track into an APR mask. This is
# the declarative replacement for the original `if tool == ...` ladder.
#
# Mechanistic rationale for the strategies:
#   - PASTA 2.0 reports a pairing free energy; lower (more negative) means more
#     stable cross-beta, hence `below`.
#   - FoldAmyloid / APPNN emit explicit per-residue flags, hence `flag`.
#   - Aggrescan emits a `Prediction` label only inside hotspots, hence `notnull`.
#   - Waltz zeroes positions outside position-specific-matrix hits, hence
#     `nonzero`.
#   - ArchCandy reports beta-arch hit intervals only, hence `present`.
#   - AggreProt / CrossBeta give continuous propensities, hence `above`.
# --------------------------------------------------------------------------- #
tools:
  - name: Aggrescan
    adapter: aggrescan
    path: examples/ribosomal/data/aggrescan/{protein}.csv
    color: "#1B9E77"
    detection: {method: notnull, column: Prediction}

  - name: APPNN
    adapter: appnn
    path: examples/ribosomal/data/appnn/{protein}.tsv
    color: "#D95F02"
    detection: {method: flag, column: is_hotspot, flag_true_values: [true]}

  - name: FoldAmyloid
    adapter: foldamyloid
    path: examples/ribosomal/data/foldamyloid/{protein}.csv
    color: "#7570B3"
    detection: {method: flag, column: Fold, flag_true_values: ["f"]}

  - name: PASTA2
    adapter: pasta2
    path: examples/ribosomal/data/pasta2/{protein}.txt
    color: "#E7298A"
    detection: {method: below, column: Score, threshold: -2.0}

  - name: Waltz
    adapter: waltz
    path: examples/ribosomal/data/waltz/{protein}.tsv
    color: "#66A61E"
    detection: {method: nonzero, column: Score}

  - name: AggreProt
    adapter: aggreprot
    path: examples/ribosomal/data/aggreprot/{protein}.csv
    color: "#E6AB02"
    detection: {method: above, column: Score, threshold: 0.5}

  - name: CrossBeta
    adapter: crossbeta
    path: examples/ribosomal/data/crossbeta/{protein}.json
    color: "#A6761D"
    detection: {method: above, column: Score, threshold: 0.5}

  - name: ArchCandy
    adapter: archcandy
    path: examples/ribosomal/data/archcandy/{protein}.csv
    color: "#666666"
    detection: {method: present}

# --------------------------------------------------------------------------- #
# Consensus model. Tiers are fractions of the active predictor set, so the
# scheme is invariant to how many tools are run: with eight enabled predictors,
# `unanimous` = 8/8, `strong` >= 6/8, `moderate` >= 4/8, exactly reproducing the
# original 8/6/4 thresholds -- but now self-adjusting if a tool is dropped.
# --------------------------------------------------------------------------- #
consensus:
  tiers:
    - {name: unanimous, min_fraction: 1.0,  color: "#B2182B"}
    - {name: strong,    min_fraction: 0.75, color: "#2166AC"}
    - {name: moderate,  min_fraction: 0.5,  color: "#FDAE61"}
  min_region_length: 5
  coverage_fraction: 0.8
  overlap_resolution_max: 0.3
  denominator: configured

viz:
  dpi: 200
  save_svg: true
  font_family: DejaVu Sans
