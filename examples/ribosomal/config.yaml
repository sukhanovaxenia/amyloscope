# amyloscope example configuration
# ----------------------------------
# This file reproduces the original hardcoded ribosomal-protein analysis as an
# explicit, validated configuration. Everything the legacy scripts baked into
# Python source -- the RPS2->eS2 display map, per-protein lengths, the eight
# predictors and their APR-calling rules, the consensus tiers, the domain
# palette, and the ribosome-protection interpretation -- now lives here.
#
# The same package, pointed at a different config, analyses any protein panel.
#
# Inputs are SYNTHETIC fixtures generated by make_fixtures.py; regenerate them
# with `python examples/ribosomal/make_fixtures.py`, then run from the repo root:
#   amyloscope run examples/ribosomal/config.yaml

name: ribosomal_amyloidogenicity
output_dir: examples/ribosomal/output

# Optional analysis hypothesis. Previously this ribosome-protection narrative
# was hardcoded into the statistical-report generator; surfacing it here keeps
# the report engine protein-agnostic while preserving the interpretation.
hypothesis: >
  Aggregation-prone regions in ribosomal proteins are expected to coincide with
  rRNA-contacting surfaces. In the assembled ribosome these surfaces are buried
  against RNA and therefore sterically protected from intermolecular cross-beta
  pairing; the same segments are predicted to be exposed, and thus aggregation-
  competent, only in the free (pre-assembly or post-degradation) protein. APR
  enrichment within RNA-binding domains is consistent with this masking model.

# --------------------------------------------------------------------------- #
# Protein panel. `id` resolves file paths; `display_name` is the figure label
# (the single configured replacement for the triplicated naming map). Domains
# carry an abstract `category` that the palette colours, decoupling rendering
# from ribosome-specific fold names.
# --------------------------------------------------------------------------- #
proteins:
  - id: RPS2
    display_name: eS2
    length: 120
    domains:
      - {name: N-terminal extension, start: 1,   stop: 17,  category: disordered}
      - {name: rRNA-binding core,    start: 18,  stop: 86,  category: rna_binding}
      - {name: globular C-lobe,      start: 87,  stop: 120, category: structured_core}

  - id: RPL36
    display_name: eL36
    length: 105
    domains:
      - {name: zinc-ribbon core,     start: 6,   stop: 70,  category: structured_core}
      - {name: rRNA contact loop,    start: 71,  stop: 105, category: rna_binding}

  - id: RPS28
    display_name: eS28
    length: 69
    domains:
      - {name: OB-fold barrel,       start: 5,   stop: 55,  category: structured_core}
      - {name: rRNA-binding loop,    start: 56,  stop: 69,  category: rna_binding}

  - id: RPL27
    display_name: eL27
    length: 110
    domains:
      - {name: N-terminal tail,      start: 1,   stop: 14,  category: terminal}
      - {name: rRNA-binding core,    start: 15,  stop: 90,  category: rna_binding}
      - {name: C-terminal helix,     start: 91,  stop: 110, category: structured_core}

# --------------------------------------------------------------------------- #
# Predictor panel. Each tool declares which adapter parses its native output
# and the detection strategy that converts that track into an APR mask. This is
# the declarative replacement for the original `if tool == ...` ladder.
#
# Mechanistic rationale for the strategies:
#   - PASTA 2.0 reports a pairing free energy; lower (more negative) means more
#     stable cross-beta, hence `below`.
#   - FoldAmyloid / APPNN emit explicit per-residue flags, hence `flag`.
#   - Aggrescan emits a `Prediction` label only inside hotspots, hence `notnull`.
#   - Waltz zeroes positions outside position-specific-matrix hits, hence
#     `nonzero`.
#   - ArchCandy reports beta-arch hit intervals only, hence `present`.
#   - AggreProt / CrossBeta give continuous propensities, hence `above`.
# --------------------------------------------------------------------------- #
tools:
  - name: Aggrescan
    adapter: aggrescan
    path: examples/ribosomal/data/aggrescan/{protein}.csv
    color: "#1B9E77"
    # `flag` on the cleaned boolean, NOT `notnull` on the raw Prediction column.
    # AGGRESCAN leaves Prediction blank outside Hot Spots, but its exports also
    # carry stray non-breaking spaces there (0xCA in the Mac Roman files). Under
    # `notnull` that whitespace is indistinguishable from a call: on the real
    # RPL27 export it produced a phantom single-residue APR at position 1.
    detection: {method: flag, column: is_hotspot, flag_true_values: [true]}

  - name: APPNN
    adapter: appnn
    path: examples/ribosomal/data/appnn/{protein}.tsv
    color: "#D95F02"
    detection: {method: flag, column: is_hotspot, flag_true_values: [true]}

  - name: FoldAmyloid
    adapter: foldamyloid
    path: examples/ribosomal/data/foldamyloid/{protein}.csv
    color: "#7570B3"
    detection: {method: flag, column: is_amyloidogenic, flag_true_values: [true]}

  - name: PASTA2
    adapter: pasta2
    path: examples/ribosomal/data/pasta2/{protein}.txt
    color: "#E7298A"
    detection: {method: below, column: Score, threshold: -2.0}

  - name: Waltz
    adapter: waltz
    path: examples/ribosomal/data/waltz/{protein}.tsv
    color: "#66A61E"
    detection: {method: nonzero, column: Score}

  - name: AggreProt
    adapter: aggreprot
    path: examples/ribosomal/data/aggreprot/{protein}.csv
    color: "#E6AB02"
    detection: {method: above, column: Score, threshold: 0.5}

  - name: CrossBeta
    adapter: crossbeta
    path: examples/ribosomal/data/crossbeta/{protein}.json
    color: "#A6761D"
    detection: {method: above, column: Score, threshold: 0.5}

  - name: ArchCandy
    adapter: archcandy
    path: examples/ribosomal/data/archcandy/{protein}.csv
    color: "#666666"
    detection: {method: present}
    # For output from the CURRENT service (ArchCandy 2.0, columns
    # ID,Sequence,Arch,Start,Stop,Score) use `adapter: archcandy2` instead and
    # threshold on Score. ArchCandy 2.0's documentation gives a three-band
    # calibration, not one cutoff:
    #     < 0.40          non-significant
    #     0.40 - 0.57     ambiguous
    #     >= 0.57         significant     <- what a positive call should mean
    # 0.40 is the web submission default. A detection threshold below 0.40
    # selects predictions the authors' own benchmark calls non-significant, so a
    # consensus vote built on them inherits that status rather than being a
    # weaker version of the same claim.
    #
    #   adapter: archcandy2
    #   options: {score_mode: highest}       # `cumulative` leaves the [0,1] scale
    #   detection: {method: above, column: Score, threshold: 0.57}

  - name: amyloid_predict
    adapter: amyloid_predict
    path: results/example_per_res_scores.csv
    color: "#07EAF2"
    # The probe width is now a real setting, not a comment. It used to be neither:
    # the adapter hardcoded 6aa_Avg_Score as Score while this detection rule read
    # Avg_Score, so the track that was plotted and the track that called APRs were
    # different quantities.
    #   Avg_Score      - the tool's own summary (used here); smears APR boundaries
    #                    by up to ~7 residues via the 15-aa probe, and is inflated
    #                    at the termini by that same wide window.
    #   6aa_Avg_Score  - sharpest boundary localisation; on the example sequence it
    #                    resolves a 6-11 core where Avg_Score gives 3-22.
    options: {score_column: Avg_Score}
    detection: {method: above, column: Score, threshold: 0.5}
    # No single canonical cutoff ships with the tool; 0.4-0.6 is the sensible range
    # on the example. 0.5 is the midpoint.

  # --- 11th predictor -------------------------------------------------------
  # AmyloGram is an n-gram model over a reduced amino-acid alphabet, trained on
  # the hexapeptides of AmyLoad (Burdukiewicz et al., 2017, PeerJ). It returns
  # one probability per QUERY, not per residue, so it joins a positional
  # consensus only through an explicit projection: aggressor-wrappers scores
  # every overlapping 6-mer and aggregates the windows covering each position,
  # writing the Number,Residue,Score table read here.
  #
  # It is mechanistically distinct from every other member of the panel --
  # sequence-composition statistics rather than hydrophobic clustering
  # (AGGRESCAN), packing density (FoldAmyloid), beta-pairing energy (PASTA2),
  # position-specific matrices (Waltz) or beta-arch geometry (ArchCandy) -- so
  # it adds an independent vote rather than a correlated one.
  #
  # Generate with:
  #   aggressor-run --predictors amylogram --fasta <panel>.fasta --out <dir>
  # then point `path` at the *_amylogram_per_residue.csv files.
  - name: AmyloGram
    adapter: amylogram
    path: examples/ribosomal/data/amylogram/{protein}.csv
    color: "#8C564B"
    options: {threshold: 0.5}
    detection: {method: above, column: Score, threshold: 0.5}


# --------------------------------------------------------------------------- #
# Consensus model. Tiers are fractions of the ACTIVE predictor set, so the
# scheme is invariant to how many tools are run. With the ten tools enabled
# below, `unanimous` = 10/10, `strong` >= 8/10, `moderate` >= 5/10; enabling
# AmyloGram makes it 11/11, >= 9/11 and >= 6/11.
#
# `denominator: configured` counts every CONFIGURED tool, not every tool that
# loaded. That is the conservative choice -- a predictor that failed to parse
# cannot inflate agreement by leaving the denominator -- but it means a silent
# load failure lowers every fraction. Check the load warnings before reading
# tiers: the loader names each failure, and a tool that is absent for one
# protein and present for another makes those two proteins incomparable.
# --------------------------------------------------------------------------- #
consensus:
  tiers:
    - {name: unanimous, min_fraction: 1.0,  color: "#B2182B"}
    - {name: strong,    min_fraction: 0.75, color: "#2166AC"}
    - {name: moderate,  min_fraction: 0.5,  color: "#FDAE61"}
  min_region_length: 5
  coverage_fraction: 0.8
  overlap_resolution_max: 0.3
  denominator: configured

viz:
  dpi: 200
  save_svg: true
  font_family: DejaVu Sans
  # `detailed` gates the per-protein analysis panels (plot_tool_analysis,
  # plot_consensus_analysis) and the two cross-protein overviews. It defaults to
  # false, so a config that does not set it renders only the track figures --
  # which is why the per-protein panels never appeared in example runs.
  detailed: true
